<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f3d24" />
    <title>축구 전술 보드</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top">
      <button id="backBtn" class="icon-btn" hidden aria-label="목록으로">‹</button>
      <h1 id="teamName">축구 전술 보드</h1>
      <a id="manualBtn" class="manual-btn" href="#/manual" aria-label="매뉴얼">📖<span>매뉴얼</span><i id="manualDot" class="dot" hidden></i></a>
      <button id="lockBtn" class="lock">🔒 보기</button>
    </header>

    <nav id="tabs" class="tabs">
      <a href="#/" data-tab="list">전술</a>
      <a href="#/roster" data-tab="roster">선수단</a>
    </nav>

    <main id="view"></main>

    <div id="toast" class="toast" hidden></div>

    <dialog id="loginDlg">
      <form method="dialog" id="loginForm">
        <h2>전략 제시자 로그인</h2>
        <p class="hint">보기는 로그인 없이 누구나 할 수 있습니다. 로그인하면 내 전술을 만들고 고칠 수 있습니다(다른 사람 전술은 복사해서 고칩니다).</p>
        <label>이름<input id="loginName" maxlength="20" autocomplete="username" required /></label>
        <label>개인 비밀번호<input id="loginPass" type="password" autocomplete="current-password" required /></label>
        <label id="teamWrap" hidden>팀 편집 비밀번호 <small>(처음 등록할 때 한 번만, 개인 비밀번호는 4자 이상)</small><input id="loginTeam" type="password" autocomplete="off" /></label>
        <label class="check"><input id="loginRemember" type="checkbox" checked /> 이 기기에서 로그인 유지</label>
        <p id="loginErr" class="err" hidden></p>
        <div class="row end">
          <button type="button" id="loginCancel" class="ghost">취소</button>
          <button type="submit" class="primary">확인</button>
        </div>
      </form>
    </dialog>

    <dialog id="tplDlg">
      <h2>새 전술</h2>
      <p class="hint">⭐ 추천 전술(🤖 AI테스트: AI가 시범으로 만든 것)을 고르면 장면·동선·메모·역할이 채워진 채로 만들어집니다. 그다음 원하는 대로 고치세요.</p>
      <div id="tplList" class="tpl-list"></div>
      <div class="row end" style="margin-top:10px"><button type="button" id="tplCancel" class="ghost">취소</button></div>
    </dialog>

    <dialog id="tokenDlg">
      <form method="dialog" id="tokenForm">
        <h2 id="tokTitle">선수 지정</h2>
        <div id="tokAlts"></div>
        <label id="tokPlayerWrap">명단에서 고르기<select id="tokPlayer"></select></label>
        <div class="row">
          <label style="width:90px">번호<input id="tokNum" type="number" inputmode="numeric" min="0" max="99" /></label>
          <label class="grow">이름<input id="tokName" maxlength="12" /></label>
        </div>
        <label>포지션<input id="tokPos" maxlength="6" /></label>
        <label id="tokRoleWrap">역할 메모<textarea id="tokRole" rows="2" maxlength="300"></textarea></label>
        <div class="row end">
          <button type="button" id="tokCancel" class="ghost">취소</button>
          <button type="submit" class="primary">확인</button>
        </div>
      </form>
    </dialog>

    <script src="formations.js"></script>
    <script src="templates.js"></script>
    <script src="suggest.js"></script>
    <script src="manual.js"></script>
    <script src="app.js"></script>
  </body>
</html>
