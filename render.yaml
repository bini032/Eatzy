services:
  - type: web
    name: eatzy
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    envVars:
      - key: ADMIN_KEY
        sync: false
      # 무료 플랜은 파일이 보존되지 않으므로 Upstash Redis에 저장 (README 참고)
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: DEFAULT_PLACE_QUERY
        value: 더존을지타워
